{{define "page_signup"}}{{template "layout" .}}{{end}}
{{define "content_signup"}}
{{if .FormError}}<p class="form-error" role="alert">{{.FormError}}</p>{{end}}
<form class="form-grid" id="signup-form" data-signup-form>
  <h3>Create account</h3>
  <div class="field"><label for="signup-name">Display name</label><input id="signup-name" name="name" required></div>
  <div class="field"><label for="signup-handle">Handle</label><input id="signup-handle" name="handle" required></div>
  <div class="field"><label for="signup-email">Email</label><input id="signup-email" name="email" type="email" required></div>
  <div class="field"><label for="signup-password">Password</label><input id="signup-password" name="password" type="password" minlength="8" required></div>
  <div class="field"><label for="signup-confirm">Confirm password</label><input id="signup-confirm" name="confirmPassword" type="password" minlength="8" required></div>
  <div class="field"><label for="signup-year">Year/group</label>
    <select id="signup-year" name="year">
      <option>Year 9</option>
      <option>Year 10</option>
      <option>Year 11</option>
      <option>Year 12</option>
      <option>Teacher</option>
    </select>
  </div>
  <div class="field"><label for="signup-initials">Avatar initials</label><input id="signup-initials" name="initials" maxlength="3" placeholder="YP"></div>
  <div class="field"><label for="signup-color">Avatar color</label><input id="signup-color" name="avatarColor" type="color" value="#27304f"></div>
  <div class="field"><label for="signup-bio">Bio</label><textarea id="signup-bio" name="bio" placeholder="What kind of philosophy are you interested in?"></textarea></div>
  <p class="form-error" id="signup-error" aria-live="polite"></p>
  <div class="form-actions">
    <button class="button primary" type="submit">Create account</button>
    <a class="button" href="/signin.html">I already have one</a>
  </div>
</form>
{{end}}
