{{define "page_user"}}{{template "layout" .}}{{end}}
{{define "content_user"}}
<section class="profile-hero">
  <h2>{{.User.name}}</h2>
  <p class="quiet">@{{.User.handle}} &middot; {{.User.year}}</p>
  <p>{{.User.bio}}</p>
  {{if .SignedIn}}
  <p>
    <button class="follow" type="button" data-follow-user="{{.User.id}}">Follow</button>
  </p>
  {{end}}
</section>
<section class="section-heading"><h3>Posts</h3></section>
<section class="feed" id="post-list">
  {{if .UserPosts}}
    {{range .UserPosts}}
      {{template "post_card" .}}
    {{end}}
  {{else}}
  <p class="quiet">No posts yet.</p>
  {{end}}
</section>
{{end}}
