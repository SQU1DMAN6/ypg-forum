{{define "page_create_post"}}{{template "layout" .}}{{end}}
{{define "content_create_post"}}
{{if .SignedIn}}
<form class="form-grid" id="create-post-form" data-create-post-form>
  <h3>Create Post</h3>
  <div class="field"><label for="title">Title</label><input id="title" name="title" type="text" maxlength="120" placeholder="Example: Is free will compatible with determinism?" required></div>
  <div class="field"><label for="body">Post text</label><textarea id="body" name="body" maxlength="1000" placeholder="Write your claim, evidence, and question for discussion." required></textarea></div>
  <div class="field">
    <label>Topics <span class="soft-note">Choose 1 to 3</span></label>
    <div class="chip-row selectable-topics">
      {{range .Topics}}
      <label class="chip checkbox-chip" style="--tag-color:{{topicColor .id}}"><input type="checkbox" name="topics" value="{{.id}}">{{.label}}</label>
      {{end}}
    </div>
  </div>
  <p class="form-error" id="form-error" aria-live="polite"></p>
  <div class="form-actions">
    <button class="button primary" type="submit">Post Discussion</button>
    <a class="button" href="/">Cancel</a>
  </div>
</form>
{{else}}
<section class="empty-state">
  <h3>Sign in to post</h3>
  <p><a class="button primary" href="/signin.html">Sign In</a> <a class="button" href="/signup.html">Sign Up</a></p>
</section>
{{end}}
{{end}}
