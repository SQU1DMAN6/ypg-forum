{{define "page_create_post"}}{{template "layout" .}}{{end}}
{{define "content_create_post"}}
{{if .SignedIn}}
<form class="form-grid" method="post" action="/api/posts">
  <h3>Create Post</h3>
  <div class="field"><label>Title</label><input name="title" required maxlength="120"></div>
  <div class="field"><label>Post text</label><textarea name="body" required maxlength="1000"></textarea></div>
  <div class="field"><label>Topic</label>
    <select name="topic">
      {{range .Topics}}
      <option value="{{.id}}">{{.label}}</option>
      {{end}}
    </select>
  </div>
  <button class="button primary" type="submit">Post Discussion</button>
  <a class="button" href="/">Cancel</a>
</form>
{{else}}
<section class="empty-state">
  <h3>Sign in to post</h3>
  <p><a class="button primary" href="/signin.html">Sign In</a> <a class="button" href="/signup.html">Sign Up</a></p>
</section>
{{end}}
{{end}}
